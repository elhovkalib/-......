<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Альбом памяти СВО</title>
<style>
  :root {
    --bg: #eceae6;
    --bg-panel: #f8f7f4;
    --ink: #2b2a27;
    --ink-dim: #6c6a64;
    --line: #d8d5cd;
    --accent: #9c6b2e;
    --accent-dim: #b98a4a;
    --ribbon-a: #d97b2e;
    --ribbon-b: #1c1c1a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", "PT Serif", serif;
    -webkit-font-smoothing: antialiased;
    height: 100%;
  }
  body {
    min-height: 100%;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .ribbon {
    width: 84px;
    height: 5px;
    margin: 0 auto;
    background: repeating-linear-gradient(
      90deg,
      var(--ribbon-b) 0 12px,
      var(--ribbon-a) 12px 24px
    );
  }

  /* ---------- COVER ---------- */
  #cover {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 24px;
    cursor: pointer;
  }
  .cover-photo {
    width: min(72vw, 340px);
    background: #fff;
    border: 1px solid var(--line);
    padding: 10px;
    margin-bottom: 30px;
    box-shadow: 0 2px 18px rgba(0,0,0,0.08);
  }
  .cover-photo img {
    display: block;
    width: 100%;
    height: auto;
  }
  #cover h1 {
    font-size: 32px;
    font-weight: 400;
    letter-spacing: 0.04em;
    margin: 0 0 14px;
  }
  #cover p.sub {
    margin: 0 0 26px;
    color: var(--ink-dim);
    font-size: 15px;
    font-style: italic;
    max-width: 440px;
    line-height: 1.65;
  }
  .enter-hint {
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.08em;
    border: 1px solid var(--line);
    padding: 12px 28px;
    background: var(--bg-panel);
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  #cover:hover .enter-hint { border-color: var(--accent-dim); }

  /* ---------- VIEWER ---------- */
  #viewer {
    display: none;
    min-height: 100vh;
    flex-direction: column;
  }
  #viewer.open { display: flex; }

  .viewer-top {
    text-align: center;
    padding: 34px 20px 6px;
  }
  .viewer-top .ribbon { margin-bottom: 14px; }
  .viewer-top h2 {
    font-size: 18px;
    font-weight: 400;
    letter-spacing: 0.04em;
    margin: 0;
    color: var(--ink-dim);
  }

  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px 16px 40px;
  }

  .nav-btn {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    width: 44px; height: 44px;
    flex-shrink: 0;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .nav-btn:hover:not(:disabled) { border-color: var(--accent-dim); color: var(--accent); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .nav-btn.hidden { visibility: hidden; }

  .flip-card {
    width: min(78vw, 340px);
    aspect-ratio: 3 / 4;
    perspective: 1600px;
    transition: height 0.35s ease;
  }
  .flip-card-inner {
    position: relative;
    width: 100%; height: 100%;
    transition: transform 0.7s cubic-bezier(0.4, 0.0, 0.2, 1);
    transform-style: preserve-3d;
  }
  .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border: 1px solid var(--line);
    background: var(--bg-panel);
    overflow: hidden;
  }
  .face-front { display: flex; flex-direction: column; cursor: pointer; }
  .face-front .photo-wrap { flex: 1; overflow: hidden; background: #e4e2dc; }
  .face-front img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .face-front .cap { padding: 16px 18px 18px; border-top: 1px solid var(--line); }
  .face-front .cap .nm { font-size: 16px; line-height: 1.35; color: var(--ink); }
  .face-front .cap .dt { margin-top: 6px; font-size: 12.5px; color: var(--accent); letter-spacing: 0.02em; }

  .face-back {
    transform: rotateY(180deg);
    padding: 22px 20px 18px;
    display: flex;
    flex-direction: column;
    overflow: visible;
  }
  .face-back .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    flex-shrink: 0;
  }
  .face-back .nm { font-size: 15.5px; line-height: 1.35; color: var(--ink); }
  .face-back .dt { font-size: 12.5px; color: var(--accent); margin-top: 4px; letter-spacing: 0.02em; }
  .close-btn {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink-dim);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .close-btn:hover { border-color: var(--accent-dim); color: var(--ink); }
  .face-back .txt {
    margin-top: 14px;
    color: var(--ink-dim);
    font-size: 13px;
    line-height: 1.65;
    white-space: pre-line;
  }

  footer {
    text-align: center;
    padding: 20px 20px calc(28px + env(safe-area-inset-bottom, 0px));
    color: var(--ink-dim);
    font-size: 12px;
    letter-spacing: 0.02em;
  }

  @media (max-width: 480px) {
    #cover h1 { font-size: 25px; }
    .flip-card { width: min(72vw, 300px); }
  }
</style>
</head>

  let index = 0;
  let flipped = false;

  const cover = document.getElementById('cover');
  const viewer = document.getElementById('viewer');
  const counter = document.getElementById('counter');
  const flipCard = document.getElementById('flipCard');
  const photoImg = document.getElementById('photoImg');
  const nameFront = document.getElementById('nameFront');
  const datesFront = document.getElementById('datesFront');
  const nameBack = document.getElementById('nameBack');
  const datesBack = document.getElementById('datesBack');
  const textBack = document.getElementById('textBack');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const closeBtn = document.getElementById('closeBtn');
  const frontFace = document.getElementById('frontFace');

  function frontHeight() {
    // height driven by aspect-ratio 3/4 at current width
    return flipCard.offsetWidth * (4 / 3);
  }

  function measureBackHeight(s) {
    const probe = document.createElement('div');
    probe.style.position = 'absolute';
    probe.style.visibility = 'hidden';
    probe.style.left = '-9999px';
    probe.style.width = flipCard.offsetWidth + 'px';
    probe.style.padding = '22px 20px 18px';
    probe.style.boxSizing = 'border-box';
    probe.style.fontFamily = getComputedStyle(document.body).fontFamily;
    probe.innerHTML =
      '<div style="display:flex;justify-content:space-between;gap:10px;">' +
        '<div><div style="font-size:15.5px;line-height:1.35;">' + s.name + '</div>' +
        '<div style="font-size:12.5px;margin-top:4px;">' + s.dates + '</div></div>' +
        '<div style="width:30px;height:30px;flex-shrink:0;"></div>' +
      '</div>' +
      '<div style="margin-top:14px;font-size:13px;line-height:1.65;white-space:pre-line;">' + s.text + '</div>';
    document.body.appendChild(probe);
    const h = probe.scrollHeight;
    document.body.removeChild(probe);
    return h;
  }

  function render() {
    const s = soldiers[index];
    photoImg.src = 'data:image/jpeg;base64,' + s.photo;
    photoImg.alt = s.name;
    nameFront.textContent = s.name;
    datesFront.textContent = s.dates;
    nameBack.textContent = s.name;
    datesBack.textContent = s.dates;
    textBack.textContent = s.text;
    counter.textContent = (index + 1) + ' из ' + soldiers.length;

    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === soldiers.length - 1;
    flipCard.style.height = '';
  }

  function setFlipped(v) {
    flipped = v;
    flipCard.classList.toggle('flipped', flipped);
    prevBtn.classList.toggle('hidden', flipped);
    nextBtn.classList.toggle('hidden', flipped);

    if (flipped) {
      const needed = measureBackHeight(soldiers[index]);
      const h = Math.max(needed, frontHeight());
      flipCard.style.height = h + 'px';
    } else {
      flipCard.style.height = '';
    }
  }

  cover.addEventListener('click', () => {
    cover.style.display = 'none';
    viewer.classList.add('open');
    render();
  });

  frontFace.addEventListener('click', () => setFlipped(true));
  closeBtn.addEventListener('click', () => setFlipped(false));

  prevBtn.addEventListener('click', () => {
    if (flipped || index === 0) return;
    index -= 1;
    render();
  });
  nextBtn.addEventListener('click', () => {
    if (flipped || index === soldiers.length - 1) return;
    index += 1;
    render();
  });

  document.addEventListener('keydown', (e) => {
    if (!viewer.classList.contains('open')) return;
    if (e.key === 'Escape' && flipped) setFlipped(false);
    if (e.key === 'ArrowLeft' && !flipped) prevBtn.click();
    if (e.key === 'ArrowRight' && !flipped) nextBtn.click();
  });
</script>
